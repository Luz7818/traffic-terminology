<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通用语转换器 · 口语 → 专业术语</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='2' width='16' height='28' rx='5' fill='%23111'/%3E%3Ccircle cx='16' cy='9' r='3.5' fill='%23ef4444'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23f59e0b'/%3E%3Ccircle cx='16' cy='23' r='3.5' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="traffic-light" aria-hidden="true">
        <span class="bulb red"></span><span class="bulb amber"></span><span class="bulb green"></span>
      </div>
      <div class="brand-text">
        <h1>交通用语转换器</h1>
        <p class="tagline">把口语说法翻译成标准交通术语 · 中英对照</p>
        <a class="back" href="../">← 返回主页</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="road" aria-hidden="true"></div>
</header>

<nav class="tabs-wrap">
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="convert" role="tab">口语转换</button>
    <button class="tab" data-tab="browse" role="tab">术语库</button>
  </div>
</nav>

<main class="container">

  <!-- 口语转换 -->
  <section id="view-convert" class="view active">
    <div class="card input-card">
      <label class="card-title" for="input">输入一段口语化的交通描述</label>
      <textarea id="input" rows="3"
        placeholder="例如：早高峰那个红绿灯路口加塞太严重，车根本走不动（Ctrl + Enter 直接转换）"></textarea>
      <div class="input-actions">
        <button id="btn-convert" class="btn primary">转换为专业术语</button>
        <button id="btn-clear" class="btn ghost">清空</button>
      </div>
      <div class="examples">
        <span class="examples-label">试试这些：</span>
        <div class="example-chips">
          <button class="chip example">早高峰那个红绿灯路口加塞太严重，车根本走不动</button>
          <button class="chip example">导航说前面堵死了，是不是出事故了</button>
          <button class="chip example">上高速走错匝道了，只能到下一个掉头口再调头</button>
          <button class="chip example">倒车的时候蹭了马路牙子，轮圈刮花了</button>
          <button class="chip example">这条路绿波做得好，晚上开一路绿灯特别顺</button>
        </div>
      </div>
      <div class="history hidden" id="history"></div>
    </div>

    <div id="result" class="result-area" aria-live="polite"></div>
  </section>

  <!-- 术语库 -->
  <section id="view-browse" class="view">
    <div class="card browse-controls">
      <div class="search-row">
        <input id="browse-search" type="search" placeholder="搜索术语、英文、口语说法或定义…">
        <span class="search-count" id="browse-count"></span>
      </div>
      <div class="cat-chips" id="cat-chips"></div>
    </div>
    <div class="browse-list" id="browse-list"></div>
    <div class="browse-more-wrap"><button id="browse-more" class="btn ghost hidden">加载更多</button></div>
  </section>

</main>

<footer class="footer">
  交通用语语料库 · <span id="foot-count"></span> · 数据与 Skill 位于同仓库 data/ 与 skill/ 目录
</footer>

<!-- 词条详情弹窗 -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
