name: Deploy to GitHub Pages

# web/ 是零依赖静态页，没有构建步骤：直接把四个文件当产物上传。
# 发布后地址是 https://luz7818.github.io/traffic-terminology/（项目页路径 = 仓库名）。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 本仓库此前没开过 Pages；不传这个参数时 configure-pages 直接失败：
          # Error: Get Pages site failed. Please verify that the repository has Pages enabled
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
